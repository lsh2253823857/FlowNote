plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shunci.teleprompter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shunci.teleprompter'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/teleprompterAssets'))
    }
}

tasks.register('syncTeleprompterAssets', Sync) {
    from('../../teleprompter') {
        include 'index.html', 'styles.css', 'app.js', 'core.mjs', 'manifest.webmanifest', 'sw.js'
        include 'icons/**'
    }
    into(layout.buildDirectory.dir('generated/teleprompterAssets'))
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncTeleprompterAssets')
}
